name: e2e

on:
  push:

jobs:
  playwright:
    runs-on: ubuntu-latest
    env:
      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      PLAYWRIGHT_PORT: "3000"
      REACT_APP_API_URL: "http://127.0.0.1:8000/api"
      CI: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python manage.py migrate
          python manage.py shell -c "from django.contrib.auth import get_user_model; from users.models import UserProfile; import os; U=get_user_model(); u, _ = U.objects.get_or_create(username=os.environ['E2E_USERNAME'], defaults={'email': 'e2e@example.com'}); u.set_password(os.environ['E2E_PASSWORD']); u.is_staff=False; u.is_superuser=False; u.is_active=True; u.save(); profile, _ = UserProfile.objects.get_or_create(user=u, defaults={'role': 'developer', 'is_active': True}); profile.is_active = True; profile.save()"

      - name: Start backend
        working-directory: backend
        run: |
          python manage.py runserver 0.0.0.0:8000 &

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Run E2E
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/test-results
            frontend/playwright-report
